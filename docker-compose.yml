# Local Postgres for development. Storage (R2/S3) is not emulated locally:
# use a separate dev bucket and put its credentials in api/.env.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: media
      POSTGRES_PASSWORD: media
      POSTGRES_DB: media_console
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media -d media_console"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
